<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Pagina niet gevonden · Page not found · Support Toolkit</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f7fa;
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0a1834; }
      main { max-width: 440px; text-align: center; }
      img { width: 48px; height: 48px; border-radius: 12px; }
      .code { margin: 28px 0 0; font: 500 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; color: #1765f5; }
      h1 { margin: 12px 0 0; font-size: clamp(28px, 6vw, 40px); line-height: 1.05; letter-spacing: -0.04em; font-weight: 650; }
      p { color: #5b6a84; margin: 14px 0 0; }
      a.btn { display: inline-flex; margin-top: 28px; height: 44px; align-items: center; padding: 0 20px; border-radius: 999px;
        background: #0a1834; color: #fff; text-decoration: none; font-weight: 550; font-size: 15px; }
      .en { margin-top: 36px; padding-top: 24px; border-top: 1px solid #e5e9f0; }
      .en h2 { margin: 0; font-size: 17px; letter-spacing: -0.02em; font-weight: 600; }
      .en p { font-size: 15px; margin-top: 6px; }
      .en a { display: inline-block; margin-top: 10px; color: #1765f5; font-weight: 550; font-size: 15px; }
      a.btn:focus-visible { outline: 2px solid #1765f5; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <p class="code">404 · NIET GEVONDEN</p>
      <h1>Deze pagina nam een andere route.</h1>
      <p>De pagina die je zoekt bestaat niet of is verplaatst.</p>
      <a class="btn" href="/">Terug naar Support Toolkit</a>
      <div lang="en" class="en">
        <h2>This page took a different route.</h2>
        <p>The page you are looking for does not exist or has moved.</p>
        <a href="/en/">Back to Support Toolkit (English)</a>
      </div>
    </main>
  </body>
</html>
