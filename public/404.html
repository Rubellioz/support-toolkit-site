<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Support Toolkit</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f7fa;
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0a1834; }
      main { max-width: 440px; text-align: center; }
      img { width: 48px; height: 48px; border-radius: 12px; }
      .code { margin: 28px 0 0; font: 500 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; color: #1765f5; }
      h1 { margin: 12px 0 0; font-size: clamp(28px, 6vw, 40px); line-height: 1.05; letter-spacing: -0.04em; font-weight: 650; }
      p { color: #5b6a84; margin: 14px 0 0; }
      a.btn { display: inline-flex; margin-top: 28px; height: 44px; align-items: center; padding: 0 20px; border-radius: 999px;
        background: #0a1834; color: #fff; text-decoration: none; font-weight: 550; font-size: 15px; }
      a.btn:focus-visible { outline: 2px solid #1765f5; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <p class="code">404 · NOT FOUND</p>
      <h1>This page took a different route.</h1>
      <p>The page you are looking for does not exist or has moved.</p>
      <a class="btn" href="/">Back to Support Toolkit</a>
    </main>
  </body>
</html>
